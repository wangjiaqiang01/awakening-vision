armor_tracker:
  esekf_iter_num: 5

  lost_time_thres: 0.5
  lost_time_thres_outpost: 2.0
  tracking_thres: 5

  # 4m 单板靶在云台快速运动/曝光爬升时有运动模糊，20px 中心误差
  # （100/5=20px）会把正常观测判成 out of gate，导致目标反复丢失。
  # 放宽到约 40px / 80px；再大就会接近相邻虚拟板的间距（4m 处约 50px），
  # 容易把观测匹配到错误板面，所以不继续放大。
  armor_match_gate: 200.0
  armor_match_gate_not_all_init: 400.0
  armor_match_w_center_err: 5.0
  armor_match_w_angle_err: 10.0
  armor_match_w_side_length_err: 1.0

  qxyz_common: [30.0, 30.0, 1.0]
  qyaw_common: 10.0
  qxyz_output: [1.0, 1.0, 0.5]
  qyaw_output: 0.01
  q_r: 0.0000001
  q_h: 0.0000001
  q_wpr: 0.0000001
  q_outpost_dz: 0.01

  enable_lights_measure: true
  light_match_length_ratio_gate: 0.2
  light_match_angle_gate: 0.2
  light_match_pos_gate_by_length_ratio: 5.0

  r_sigma_px_by_length_ratio: 0.2
  r_sigma_length_by_length_ratio: 0.5
  r_sigma_angle: 0.5
  r_sigma_armor_lights_depth_diff: 0.1

auto_aim_fsm:
  single_whole_up: 1.5 
  single_whole_down: 1.0
  whole_pair_up: 10.5 
  whole_pair_down: 9.5 #1s内至少换2次板子  2pi  否则轨迹规划无意义
  pair_center_up: 16.5
  pair_center_down: 15.0
  transfer_time: 0.5

very_aimer:
  type: mpc
  base_yaw_offset: 0.3
  base_pitch_offset: -2.3
  # base_yaw_offset: -0.0
  # base_pitch_offset: -0.0
  sample_total_time: 1.0
  
  # 与 srm_auto_aim Planner 对齐：HORIZON=100, DT=0.01, 输出 index=50
  sample_horizon: 100

  fire_delay_min: 0.01
  fire_delay_max: 0.05
  
  # 与 srm_auto_aim Planner 对齐：max_yaw_acc=50, max_pitch_acc=100
  max_yaw_acc: 50
  max_pitch_acc: 100
  

  # srm_auto_aim Planner: 快速靶 0.030 / 慢速靶 0.015
  prediction_delay: 0.015
