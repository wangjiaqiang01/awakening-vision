armor_detector:
  max_infer_num: 5
  # 当前使用 OpenVINO 后端；YOLOv8 关键点路径保留在 yolo_detector 下，便于回退对比。
  # yolo: 使用 同济迁移的 YOLOv8 关键点模型；openvino: 原 TUP/OpenVINO 路径。
  backend: openvino
  # YOLOv8 姿态模型（同济 迁移）。将 backend 改回 "yolo" 后启用。
  # 原 TUP/OpenVINO 路径保持不变，便于回退对比。
  yolo_detector:
    model_path: ${ROOT_DIR}/model/yolov8.xml
    device_name: "GPU.0"
    conf_threshold: 0.7
    nms_threshold: 0.3
    input_w: 416
    input_h: 416
    class_num: 2
  net_detector:
    openvino:
      model_path: ${ROOT_DIR}/model/opt-1208-001.onnx
      device_name: "GPU"
      perf_mode: "THROUGHPUT"
      # priority: "HIGH"
      # scheduling_core_type: "PCORE_ONLY"
      execution_mode: "PERFORMANCE"
      infer_request_buffer_num: 10
    tensorrt:
      model_path: ${ROOT_DIR}/model/opt-1208-001.onnx
      copy_context_num: 3
      min_free_mem_ratio: 0.1
      use_cuda_preproces: true
    armor_infer:
      model_type: tup
      conf_threshold: 0.2
  number_classifier:
    enable: true
    model_path: ${ROOT_DIR}/model/mlp.onnx
    label_path: ${ROOT_DIR}/model/label.txt
  color_classifier:
    enable: true
    diff_threshold: 20.0
  cv:
    light:
      bin_threshold: 120.0
      net_ref_threshold_tol: 50.0
      min_wh_ratio: 0.001
      max_wh_ratio: 0.4
      max_angle: 40.0
    armor:
      min_ratio: 0.8
      max_ratio: 5.0


