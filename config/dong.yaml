armor_tracker:
  esekf_iter_num: 5

  lost_time_thres: 0.5
  lost_time_thres_outpost: 2.0
  tracking_thres: 10

  # 选帧开关：1=关闭；5=每 5 个“本可进入 EKF 的有效观测帧”只真正更新 1 次。
  # 仅降低 EKF 测量更新率，detector 仍按原帧率跑；用于模拟同济 20Hz 观测。
  ekf_update_stride: 1

  # 匹配门控：100/5=20px 中心误差；非初始帧 200/5=40px。
  # 从 200/400 收回一半，观察武科灯条模型下的 found/ekf_frames 是否下降。
  armor_match_gate: 50.0
  armor_match_gate_not_all_init: 100.0
  armor_match_w_center_err: 5.0
  armor_match_w_angle_err: 10.0
  armor_match_w_side_length_err: 1.0

  qxyz_common: [30.0, 30.0, 1.0]
  qyaw_common: 1.0
  qxyz_output: [1.0, 1.0, 0.5]
  qyaw_output: 0.01
  q_r: 0.0000001
  q_h: 0.0000001
  q_wpr: 0.0000001
  q_outpost_dz: 0.01

  enable_lights_measure: true
  light_match_length_ratio_gate: 0.2
  light_match_angle_gate: 0.2
  light_match_pos_gate_by_length_ratio: 5.0

  r_sigma_px_by_length_ratio: 0.2
  r_sigma_length_by_length_ratio: 0.5
  r_sigma_angle: 0.5
  r_sigma_armor_lights_depth_diff: 0.1

auto_aim_fsm:
  single_whole_up: 1.5 
  single_whole_down: 1.0
  whole_pair_up: 10.5 
  whole_pair_down: 9.5 #1s内至少换2次板子  2pi  否则轨迹规划无意义
  pair_center_up: 16.5
  pair_center_down: 15.0
  transfer_time: 0.5

very_aimer:
  # WUST 原版没有 type；当前 constructor 必填，显式 limit 即非 MPC 路径
  type: mpc
  # MPC 轨迹复用与取点模式（仅 type: mpc 时生效）：
  #   vision_d  = 帧驱动 plan 循环（无 1000Hz 定时），不复用旧轨迹，start_at_now 前向窗口 + 滞后前推 + k=1 外推 1 步（dt=0.01s 即 +20ms）
  #   awakening = 原版 1000Hz solver，居中窗口 + is_same 轨迹复用 + time_in_traj 线性插值
  mpc_mode: vision_d
  # 实测云台响应滞后补偿 (ms)，仅 mpc_mode: vision_d 生效；自动扣除 2*dt 前视（参考 vision-d 的 planner_gimbal_response_delay_ms）
  gimbal_response_delay_ms: 0.0
  base_yaw_offset: 0.3
  base_pitch_offset: -2.3
  # base_yaw_offset: -0.0
  # base_pitch_offset: -0.0
  sample_total_time: 1.0
  
  # 与 srm_auto_aim Planner 对齐：HORIZON=100, DT=0.01, 输出 index=50
  sample_horizon: 200

  fire_delay_min: 0.01
  fire_delay_max: 0.05
  
  # 武科原版 Planner 参数
  max_yaw_acc: 40
  max_pitch_acc: 50
  

  # srm_auto_aim Planner: 快速靶 0.030 / 慢速靶 0.015
  prediction_delay: 0.00
  aim_center_more_prediction_time: 0.0

  shooting_range_h: 0.12
  shooting_range_w_small: 0.12
  shooting_range_w_large: 0.24
  min_enable_pitch_deg: 0.25
  min_enable_yaw_deg: 0.25
  ballistic_trajectory:
    gravity: 9.8
    resistance: 0.001

