mode: auto_aim
enemy_color: blue
bullet_speed: 21.0

serial:
  enable: true
  device_name: /dev/serial/by-id/usb-YueLuEmbedded_Vision_Comm_port_3855315E3439-if00
  baud_rate: 115200
  char_size: 8
  read_buf_size: 4096
  # 同济协议：回传 ID 1 = 云台姿态（yaw/pitch/roll 度）、2 = 弹速；
  # 发送为 18 字节控制帧（id1 云台角 + id2 开火标志），见 src/utils/drivers/command_protocol.hpp。
  # ID 已对齐 control-2026 的 master_process.c InitParam 注册（gimbal=1, shoot=2）。
  telemetry_gimbal_id: 1
  telemetry_shoot_id: 2
  frame_timeout_ms: 1000
  idle_timeout_ms: 3000
  reconnect_ms: 500
  # Mirror the proven in-team SrmLink behavior: fixed-rate, latest-value-only TX.
  command_tx_hz: 100
  command_timeout_ms: 500
  command_guard:
    # raw = 发送边界完全旁路 command_guard；不是只把阈值放宽。
    profile: raw
    acquire_ms: 0
    fire_settle_ms: 0
    min_distance_m: 0.01
    max_distance_m: 100.0
    max_yaw_jump_deg: 360.0
    max_pitch_jump_deg: 180.0
    max_yaw_rate_deg_s: 1000000000.0
    max_pitch_rate_deg_s: 1000000000.0
    filter_time_constant_s: 0.0
    fire_alignment_tolerance_deg: 180.0
    reset_on_target_change: false
  # 视觉 pitch（抬头为正）-> 固件 IMU Pitch 的符号，只在发送边界生效。
  # 哨兵（IMU 安装 .Pitch = 0）实机验证为 -1；IMU 倒装的车（如六轮步兵 .Pitch = 180）应改为 1。
  # 首次上车先小角度点动：云台朝反方向走就取反，改这里即可，无需重新编译。
  pitch_sign: -1
serial_send_to_image_microseconds: 2000
use_sim: false

